server:
  port: 8085
spring:
  application:
    name: job-portal-user-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/job_portal_user
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

jwt:
  secret: 11cb3ab56c799207283b20a5bc7642bdfa2a1de524e73a546bb096172614c5bbc0a8b9433019bcb635bb6c32ad6bae721dec9e16e69500f69a3b3d0b823b9c44

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true