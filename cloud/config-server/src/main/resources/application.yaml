server:
  port: 8888
spring:
  application:
    name: job-portal-config-server
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/joahanw/job-portal-ai-config.git"
          clone-on-start: true
          default-label: master

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true